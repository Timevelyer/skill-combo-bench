name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (offline mock path)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML==6.0.2 jsonschema==4.23.0 numpy==1.26.4 scipy==1.13.1 Pillow==10.4.0

      - name: Compile check
        run: python -m compileall -q engine adapters tools

      - name: Validate config, schemas and datasets
        run: python -m tools.bench_runner validate

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py" -v

      - name: End-to-end test
        run: python -m unittest discover -s tests/e2e -p "test_*.py" -v
